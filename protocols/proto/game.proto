syntax = "proto3";

package game;

import "common.proto";

/**
 * ==================== UI 面板 ====================
 */

/**
 * 更新面板位置请求
 */
message UpdateUIPanelPosRequest {
  float pos_x = 1;
  float pos_y = 2;
  float width = 3;
  float height = 4;
}

/**
 * 更新面板位置响应
 */
message UpdateUIPanelPosResponse {
  common.ErrorCode code = 1;
  string message = 2;
}

/**
 * ==================== 战斗日志 ====================
 */

/**
 * 战斗日志条目类型
 */
enum CombatLogType {
  COMBAT_LOG_START = 0;      // 战斗开始
  COMBAT_LOG_SKILL = 1;      // 释放技能
  COMBAT_LOG_DAMAGE = 2;     // 造成伤害
  COMBAT_LOG_HEAL = 3;       // 治疗/回血
  COMBAT_LOG_BUFF = 4;       // 获得 Buff/Debuff
  COMBAT_LOG_DODGE = 5;      // 闪避/打空
  COMBAT_LOG_DEATH = 6;      // 死亡
  COMBAT_LOG_END = 7;        // 战斗结束/脱战
  COMBAT_LOG_BUFF_APPLY = 8;   // 施加 Buff
  COMBAT_LOG_BUFF_REMOVE = 9;  // Buff 消失
  COMBAT_LOG_BUFF_TICK = 10;   // Buff tick 效果（DOT 等）
  COMBAT_LOG_SHIELD_ABSORB = 11; // 护盾吸收
}

/**
 * 单条战斗日志
 */
message CombatLogEntry {
  CombatLogType log_type = 1;    // 日志类型
  uint64 timestamp = 2;            // 服务器时间戳（秒）
  string actor_name = 3;           // 行为发起者名称
  string target_name = 4;          // 目标名称（可选）
  string skill_name = 5;           // 技能名称（可选）
  int32 value = 6;                 // 数值（伤害/治疗量，可选）
  string extra = 7;                // 额外文本（可选）
}

/**
 * 战斗日志批量推送
 */
message CombatLogNotify {
  repeated CombatLogEntry entries = 1;
}

/**
 * 战斗状态推送（纯 CD 即时制）
 */
message CombatStateNotify {
  message SkillCdEntry {
    uint32 skill_id = 1;
    float remaining_cd = 2;  // 剩余CD（秒）
    float total_cd = 3;      // 总CD时长（秒，用于遮罩百分比）
  }
  message CombatUnit {
    uint64 entity_id = 1;      // account_id 或 instance_id
    string entity_name = 2;    // 显示名称
    float atb = 3;             // 【已废弃】纯 CD 制下始终为 0，保留以兼容旧客户端
    bool is_player = 4;        // true=玩家, false=怪物
    int32 hp = 5;              // 当前血量
    int32 max_hp = 6;          // 最大血量
    string casting_skill = 7;  // 正在蓄力的技能名（空=不在蓄力）
    float cast_progress = 8;   // 蓄力进度 0.0~1.0
    repeated SkillCdEntry skill_cds = 9;  // 当前正在CD中的技能
    int32 mp = 10;             // 当前魔法
    int32 max_mp = 11;         // 最大魔法
    repeated BuffInfo buffs = 12;  // 当前 Buff/Debuff 列表
  }
  message BuffInfo {
    int32 buff_id = 1;         // Buff 配置 ID
    string buff_name = 2;      // Buff 名称
       int32 stacks = 3;          // 叠加层数
    float remaining_time = 4;  // 剩余时间（秒）
    int32 shield_amount = 5;   // 护盾剩余量
  }
  repeated CombatUnit units = 1;
}

/**
 * Buff 独立更新推送（非战斗场景下的 buff 变化通知）
 * 战斗场景仍由 CombatStateNotify 推送完整状态
 */
message BuffUpdateNotify {
  uint64 entity_id = 1;              // 目标实体 ID
  repeated BuffEntry buffs = 2;     // 当前完整 buff 列表（全量替换）

  message BuffEntry {
    int32 buff_id = 1;              // Buff 配置 ID
    string buff_name = 2;           // Buff 名称
    int32 stacks = 3;               // 叠加层数
    float remaining_time = 4;       // 剩余时间（秒）
    int32 shield_amount = 5;        // 护盾剩余量
  }
}

/**
 * ==================== 角色信息定义 ====================
 */

/**
 * 完整角色信息（进入游戏后返回）
 */
message FullRoleInfo {
  uint64 role_id = 1;           // 角色ID
  string role_name = 2;         // 角色名
  uint32 level = 3;             // 等级
  uint64 exp = 4;               // 经验值
  uint32 avatar_id = 5;         // 头像ID
  uint64 gold = 6;              // 金币
  uint64 diamond = 7;           // 钻石
  uint64 total_power = 8;       // 总战力
  uint32 vip_level = 9;         // VIP等级
  uint64 create_time = 10;      // 创建时间
  uint64 last_login_time = 11;  // 上次登录时间
  string job = 12;              // 职业
  string title = 13;            // 称号
  string status = 14;           // 状态
  string current_map = 15;      // 当前地图
  int32 grid_x = 16;            // 格子X
  int32 grid_y = 17;            // 格子Y
  float ui_panel_pos_x = 18;    // 综合面板位置X
  float ui_panel_pos_y = 19;    // 综合面板位置Y
  float ui_panel_width = 20;    // 综合面板宽度
  float ui_panel_height = 21;   // 综合面板高度
  repeated AttrItem attrs = 22; // 战斗属性集合（key-value，接 luban 枚举）
  repeated uint32 learned_skills = 23;  // 已学会的技能ID列表
  repeated uint32 equipped_skills = 24; // 已装备的技能ID列表
}

/**
 * 道具信息
 */
message ItemInfo {
  uint32 item_id = 1;           // 道具ID
  uint32 count = 2;             // 数量
}

/**
 * 任务信息
 */
message TaskInfo {
  uint32 task_id = 1;           // 任务ID
  uint32 status = 2;            // 状态：0未接 1进行中 2已完成
  uint32 progress = 3;          // 进度
}

/**
 * ==================== 进入游戏流程 ====================
 */

/**
 * 进入游戏请求（选择已有角色）
 */
message EnterGameRequest {
  uint64 role_id = 1;           // 角色ID
}

/**
 * 进入游戏响应
 */
message EnterGameResponse {
  common.ErrorCode code = 1;
  string message = 2;
  FullRoleInfo role_info = 3;           // 完整角色信息
  repeated ItemInfo items = 4;          // 背包道具
  repeated TaskInfo tasks = 5;          // 任务列表
  uint32 server_time = 6;               // 服务器时间
  repeated ChestInfo chests = 7;        // 地图宝箱列表
}

/**
 * ==================== 创建角色流程 ====================
 */

/**
 * 创建角色请求
 */
message CreateRoleRequest {
  string role_name = 1;         // 角色名
}

/**
 * 创建角色响应
 * 创建成功后直接返回角色信息，自动进入游戏
 */
message CreateRoleResponse {
  common.ErrorCode code = 1;
  string message = 2;
  FullRoleInfo role_info = 3;           // 新创建的角色信息
  repeated ItemInfo items = 4;          // 初始道具
  repeated TaskInfo tasks = 5;          // 初始任务
  uint32 server_time = 6;               // 服务器时间
  repeated ChestInfo chests = 7;        // 地图宝箱列表
}

/**
 * 宝箱更新推送（服务器主动推送新增/删除的宝箱）
 */
message ChestUpdateNotify {
  repeated ChestInfo chests = 1;        // 当前地图完整宝箱列表
}

/**
 * ==================== 移动系统 ====================
 */

/**
 * 移动请求（客户端预测：先移动后确认）
 * is_continuous=true 时表示开始/维持连续移动，to_x/to_y 为方向向量(-1/0/1)
 */
message MoveRequest {
  int32 from_x = 1;             // 起点 X
  int32 from_y = 2;             // 起点 Y
  int32 to_x = 3;               // 终点 X，或连续移动时的方向 X
  int32 to_y = 4;               // 终点 Y，或连续移动时的方向 Y
  string map_name = 5;          // 地图名
  bool is_continuous = 6;       // 是否为连续移动（向量驱动）
}

/**
 * 移动响应
 */
message MoveResponse {
  common.ErrorCode code = 1;
  string message = 2;
  int32 x = 3;                  // 服务器确认的位置 X（失败时为合法位置）
  int32 y = 4;                  // 服务器确认的位置 Y
  int32 duration_ms = 5;        // 移动总时长（毫秒）
  int32 check_ratio = 6;        // 检查点比例 0-100
  int32 dual_start_ratio = 7;   // 双格开始比例 0-100
  int32 dual_end_ratio = 8;     // 双格结束比例 0-100
}

/**
 * 移动确认请求（客户端在检查点发送，无需等待回复）
 */
message MoveConfirmRequest {
  int32 target_x = 1;
  int32 target_y = 2;
}

/**
 * 移动完成请求（客户端在移动结束时发送）
 */
message MoveCompleteRequest {
  int32 target_x = 1;
  int32 target_y = 2;
}

/**
 * 移动取消通知（服务器主动推送）
 */
message MoveCancelNotify {
  uint64 entity_id = 1;
  int32 rollback_x = 2;
  int32 rollback_y = 3;
}

/**
 * 碰撞通知（客户端30%检测到敌人后直接发送，服务端校验并触发战斗）
 */
message MoveCollisionNotify {
  int32 target_x = 1;            // 碰撞目标格 X
  int32 target_y = 2;            // 碰撞目标格 Y
}

/**
 * ==================== 背包系统 ====================
 */

/**
 * 使用物品请求
 */
message UseItemRequest {
  uint32 item_id = 1;            // 物品ID
  uint32 count = 2;              // 使用数量
}

/**
 * 使用物品响应
 */
message UseItemResponse {
  common.ErrorCode code = 1;
  string message = 2;
  repeated ItemInfo items = 3;   // 更新后的完整背包
}

/**
 * 丢弃物品请求
 */
message DropItemRequest {
  uint32 item_id = 1;            // 物品ID
  uint32 count = 2;              // 丢弃数量
}

/**
 * 丢弃物品响应
 */
message DropItemResponse {
  common.ErrorCode code = 1;
  string message = 2;
  repeated ItemInfo items = 3;   // 更新后的完整背包
}

/**
 * 背包排序请求
 */
message InventoryReorderRequest {
  repeated uint32 ordered_item_ids = 1;  // 客户端期望的道具顺序
}

/**
 * 背包排序响应
 */
message InventoryReorderResponse {
  common.ErrorCode code = 1;
  string message = 2;
  repeated ItemInfo items = 3;   // 排序后的完整背包
}

/**
 * ==================== GM 系统 ====================
 */

/**
 * GM 命令请求
 */
message GmCommandRequest {
  string command = 1;            // 命令名（如 "additem"）
  string args = 2;               // 参数（如 "1001:5"）
}

/**
 * GM 命令响应
 */
message GmCommandResponse {
  common.ErrorCode code = 1;
  string message = 2;
  repeated ItemInfo items = 3;   // 如果影响背包，返回更新后的背包
  repeated uint32 learned_skills = 4;  // 已学会的技能ID列表
  repeated uint32 equipped_skills = 5; // 已装备的技能ID列表
}

/**
 * ==================== 统一实体系统 ====================
 */

/**
 * 实体类型枚举
 */
enum EntityType {
  ENTITY_TYPE_PLAYER = 0;
  ENTITY_TYPE_MONSTER = 1;
  ENTITY_TYPE_NPC = 2;
  ENTITY_TYPE_BOSS = 3;
  ENTITY_TYPE_PET = 4;
  ENTITY_TYPE_GUARD = 5;
  ENTITY_TYPE_GATHER_NODE = 6;
  ENTITY_TYPE_PORTAL = 7;
  ENTITY_TYPE_CHEST = 8;
}

/**
 * 组件类型枚举
 */
enum ComponentType {
  COMPONENT_COMBAT = 0;
  COMPONENT_MOVE = 1;
  COMPONENT_CAST = 2;
  COMPONENT_AI = 3;
  COMPONENT_INTERACT = 4;
  COMPONENT_GATHER = 5;
}

/**
 * 战斗组件数据
 */
message CombatComponentData {
  int32 hp = 1;
  int32 max_hp = 2;
  int32 mp = 3;
  int32 max_mp = 4;
  int32 level = 5;
  repeated AttrItem attrs = 6;
  bool in_combat = 7;
}

/**
 * 移动组件数据
 */
message MoveComponentData {
  int32 speed_ms = 1;
  bool is_moving = 2;
  int32 target_x = 3;
  int32 target_y = 4;
}

/**
 * 施法组件数据
 */
message CastComponentData {
  repeated uint32 equipped_skills = 1;
  uint32 casting_skill_id = 2;
}

/**
 * 交互组件数据
 */
message InteractComponentData {
  int32 npc_id = 1;
  int32 npc_type = 2;
  bool in_combat = 3;
}

/**
 * 实体快照（创建/同步用）
 */
message EntitySnapshot {
  uint64 entity_id = 1;
  EntityType entity_type = 2;
  repeated ComponentType components = 3;
  int32 x = 4;
  int32 y = 5;
  string name = 6;
  int32 template_id = 7;  // MonsterId/NpcId 等
  // 组件数据按需附加
  CombatComponentData combat = 10;
  MoveComponentData move = 11;
  CastComponentData cast = 12;
  InteractComponentData interact = 14;
}

/**
 * 地图实体列表通知（进入地图时下发）
 */
message MapEntityListNotify {
  repeated EntitySnapshot entities = 1;
}

/**
 * 实体创建通知（新实体出现）
 */
message EntityCreateNotify {
  EntitySnapshot entity = 1;
}

/**
 * 实体销毁通知
 */
message EntityDestroyNotify {
  uint64 entity_id = 1;
}

/**
 * ==================== 怪物系统 ====================
 */

/**
 * 通用属性项（角色/怪物共用，key 对应枚举）
 * 角色属性枚举约定: 1=HP 2=MaxHP 3=MP 4=MaxMP 5=Agility 6=PAtk 7=MAtk 8=PDef 9=MDef
 */
message AttrItem {
  uint32 key = 1;
  int32 value = 2;
}

/**
 * 怪物属性项（兼容旧字段，后续可迁移到 AttrItem）
 */
message MonsterAttr {
  uint32 attr_key = 1;           // 属性键（对应 EMonsterAttr）
  int32 attr_value = 2;          // 属性值
}

/**
 * 地图上的怪物信息
 */
message MonsterInfo {
  uint32 instance_id = 1;        // 实例配置ID（来自 TbMapMonster.id）
  uint32 monster_id = 2;         // 怪物类型ID（来自 TbMonster.id）
  int32 x = 3;                   // 格子 X
  int32 y = 4;                   // 格子 Y
  string name = 5;               // 怪物名称
  uint32 level = 6;              // 等级
  repeated MonsterAttr attrs = 7; // 属性列表
}

/**
 * 怪物移动/状态更新推送（服务器主动广播）
 */
message MonsterMoveNotify {
  uint32 instance_id = 1;        // 怪物实例ID
  int32 from_x = 2;              // 起点 X
  int32 from_y = 3;              // 起点 Y
  int32 to_x = 4;                // 终点 X
  int32 to_y = 5;                // 终点 Y
  string state = 6;              // 状态：idle | patrol | chase | return
  int32 duration_ms = 7;         // 移动耗时（毫秒），客户端据此播放动画
}

/**
 * 怪物状态批量更新推送
 */
message MonsterStateBatchNotify {
  repeated MonsterMoveNotify monsters = 1;
}

/**
 * 怪物死亡通知（服务器主动广播）
 */
message MonsterDeathNotify {
  uint32 instance_id = 1;        // 怪物实例ID
  uint64 killer_id   = 2;        // 击杀者实体ID（玩家account_id或怪物instance_id）
  uint32 monster_id  = 3;        // 怪物类型ID
}

/**
 * 怪物复活通知（服务器主动广播）
 */
message MonsterRespawnNotify {
  uint32 instance_id = 1;        // 怪物实例ID
  uint32 monster_id  = 2;        // 怪物类型ID
  int32 x = 3;                   // 复活位置 X
  int32 y = 4;                   // 复活位置 Y
  string name = 5;               // 怪物名称
  uint32 level = 6;              // 等级
}

/**
 * ==================== NPC 系统 ====================
 */

message NpcInfo {
  uint64 npc_instance_id = 1;
  string npc_name        = 2;
  int32  npc_type        = 3;   // NPC类型：1=转职大师
  int32  x               = 4;
  int32  y               = 5;
}

/**
 * NPC交互通知（玩家撞向NPC时服务端推送）
 */
message NpcInteractNotify {
  uint64 npc_instance_id = 1;
  string npc_name        = 2;
  int32  npc_type        = 3;
}

/**
 * 转职请求
 */
message ChangeJobRequest {
  string target_job = 1;
}

/**
 * 转职响应
 */
message ChangeJobResponse {
  common.ErrorCode code            = 1;
  string           message         = 2;
  string           current_job     = 3;
  repeated uint32  learned_skills  = 4;
  repeated uint32  equipped_skills = 5;
}

/**
 * NPC挑战请求（玩家点击"挑战"按钮时发送）
 */
message NpcCombatRequest {
  uint64 npc_instance_id = 1;  // NPC实例ID
}

/**
 * NPC挑战响应
 */
message NpcCombatResponse {
  common.ErrorCode code            = 1;
  uint64           npc_instance_id = 2;  // NPC实例ID
}

/**
 * 技能装备请求
 */
message EquipSkillRequest {
  uint32 skill_id = 1;
  uint32 slot_index = 2;  // 装备到哪个槽位
}

/**
 * 技能装备响应
 */
message EquipSkillResponse {
  common.ErrorCode code = 1;
  string           message = 2;
  repeated uint32  equipped_skills = 3;
}

/**
 * 技能卸下请求
 */
message UnequipSkillRequest {
  uint32 skill_id = 1;
  uint32 slot_index = 2;  // 从哪个槽位卸下
}

/**
 * 技能卸下响应
 */
message UnequipSkillResponse {
  common.ErrorCode code = 1;
  string           message = 2;
  repeated uint32  equipped_skills = 3;
}

/**
 * 设置优先技能请求 — 被选中的技能在 ATB 满时优先释放
 */
message SetPreferredSkillRequest {
  uint32 skill_id = 1;  // 0 = 取消优先
}

message SetPreferredSkillResponse {
  common.ErrorCode code = 1;
  string           message = 2;
  uint32           preferred_skill_id = 3;
}

/**
 * 技能施法请求 — 玩家主动释放技能（纯 CD 制，不再需要 ATB）
 */
message CastRequest {
  uint32 skill_id = 1;       // 请求释放的技能 ID
  uint64 target_id = 2;      // 目标实体 ID（可选，0 = 自动选择）
}

message CastResponse {
  bool   success = 1;
  string error = 2;          // 失败原因：cooldown / out_of_range / not_in_combat / no_mp / invalid_skill / already_casting / post_cast
}

/**
 * 升级通知
 */
message LevelUpNotify {
  int32  old_level   = 1;
  int32  new_level   = 2;
  int32  max_hp      = 3;
  int32  max_mp      = 4;
  int32  hp          = 5;
  int32  mp          = 6;
  int32  patk        = 7;
  int32  matk        = 8;
  int32  pdef        = 9;
  int32  mdef        = 10;
}

/**
 * ==================== 地图信息同步 ====================
 */

/**
 * ==================== 地形系统 ====================
 */

/**
 * 地图格子信息（进入地图时同步地形数据）
 */
message TileInfo {
  int32 x = 1;                // 格子 X
  int32 y = 2;                // 格子 Y
  int32 terrain_type = 3;     // 地形类型 (0=普通, 1=水域...)
  int32 decoration_type = 4;  // 装饰类型 (0=无, 1=房舍...)
}

/**
 * 地图信息同步通知（进入/切换地图时推送）
 */
message MapInfoSyncNotify {
  string map_name = 1;                  // 地图名
  repeated ChestInfo chests = 2;        // 地图宝箱列表
  repeated MonsterInfo monsters = 3;  // 地图怪物列表
  repeated NpcInfo npcs = 4;          // 地图NPC列表
  repeated DropItemInfo drops = 5;    // 地图掉落物列表
  repeated TileInfo tiles = 6;          // 地图地形数据（新增）
}

/**
 * 切换地图请求
 */
message ChangeMapRequest {
  string target_map = 1;                // 目标地图名
}

/**
 * 切换地图响应
 */
message ChangeMapResponse {
  common.ErrorCode code = 1;
  string message = 2;
  string map_name = 3;                  // 当前地图名
  int32 spawn_x = 4;                    // 出生点 X
  int32 spawn_y = 5;                    // 出生点 Y
}

/**
 * ==================== 宝箱系统 ====================
 */

/**
 * 地图上的宝箱信息
 */
message ChestInfo {
  uint32 chest_id = 1;           // 宝箱实例ID
  int32 x = 2;                  // 格子 X
  int32 y = 3;                  // 格子 Y
  bool opened = 4;              // 是否已打开
}

/**
 * 开箱请求
 */
message OpenChestRequest {
  uint32 chest_id = 1;           // 宝箱实例ID
}

/**
 * 开箱响应
 */
message OpenChestResponse {
  common.ErrorCode code = 1;
  string message = 2;
  repeated ItemInfo items = 3;   // 获得的物品
}

/**
 * ==================== 死亡重生 ====================
 */

/**
 * 玩家死亡通知（服务器主动推送）
 */
message PlayerDeathNotify {
  int32 spawn_x = 1;     // 重生点 X
  int32 spawn_y = 2;     // 重生点 Y
  int32 hp = 3;          // 恢复后的 HP
  int32 max_hp = 4;      // 最大 HP
  int32 mp = 5;          // 恢复后的 MP
  int32 max_mp = 6;      // 最大 MP
}

/**
 * 战斗开始通知（碰撞触发）
 */
message CombatStartNotify {
  repeated uint64 entity_ids = 1;
}

/**
 * 战斗结束原因
 */
enum CombatEndReason {
  COMBAT_END_DISENGAGE = 0;  // 脱战
  COMBAT_END_DEATH = 1;      // 死亡
}

/**
 * 战斗结束通知
 */
message CombatEndNotify {
  CombatEndReason reason = 1;
  repeated uint64 entity_ids = 2;
}

/**
 * 读条开始通知（cast_time > 0 时广播）
 */
message CastStartNotify {
  uint64 caster_id = 1;
  uint32 skill_id = 2;
  float cast_time = 3;
  uint64 target_id = 4;    // 主目标
  int32 target_x = 5;      // 若是 GroundPos
  int32 target_y = 6;
}

/**
 * 技能释放结果通知（成功/打空）
 */
message CastResultNotify {
  uint64 caster_id = 1;
  uint32 skill_id = 2;
  repeated uint64 target_ids = 3;
  bool is_miss = 4;        // true = 打空（无合法目标）
}

/**
 * 战斗事件通知（伤害/治疗/Buff）
 */
message CombatEventNotify {
  uint64 target_id = 1;
  int32 hp_delta = 2;      // 正值=治疗，负值=伤害
  int32 mp_delta = 3;
  repeated CombatBuffEntry buffs = 4;
}

message CombatBuffEntry {
  int32 buff_id = 1;
  string buff_name = 2;
  int32 stacks = 3;
  float remaining_time = 4;
  int32 shield_amount = 5;
}

/**
 * 弹道生成通知（当前未实现弹道系统，预留）
 */
message ProjectileSpawnNotify {
  uint64 projectile_id = 1;
  uint32 skill_id = 2;
  int32 from_x = 3;
  int32 from_y = 4;
  int32 to_x = 5;
  int32 to_y = 6;
  float speed = 7;
}

/**
 * 弹道命中通知（当前未实现弹道系统，预留）
 */
message ProjectileHitNotify {
  uint64 projectile_id = 1;
  uint64 target_id = 2;
  repeated CombatEventNotify events = 3;
}

/**
 * 单体脱战通知
 */
message DisengageNotify {
  uint64 entity_id = 1;
}

/**
 * 怪物移动取消通知（服务器主动推送）
 */
message MonsterMoveCancelNotify {
  uint32 instance_id = 1;
  int32 rollback_x = 2;
  int32 rollback_y = 3;
}


// ==================== 掉落/拾取 ====================

/**
 * 掉落物信息
 */
message DropItemInfo {
  uint64 drop_id = 1;       // 掉落物唯一 ID
  uint32 item_id = 2;       // 物品 ID
  uint32 count = 3;         // 数量
  int32 x = 4;              // 格子 X
  int32 y = 5;              // 格子 Y
  uint64 owner_id = 6;      // 归属玩家（0=所有人可见可拾取）
}

/**
 * 掉落物生成通知（广播给地图上所有玩家）
 */
message DropSpawnNotify {
  repeated DropItemInfo drops = 1;
}

/**
 * 掉落物拾取通知（广播给地图上所有玩家）
 */
message DropPickupNotify {
  uint64 drop_id = 1;       // 被拾取的掉落物 ID
  uint64 picker_id = 2;     // 拾取者 ID
  uint32 item_id = 3;       // 物品 ID
  uint32 count = 4;         // 原掉落数量
  uint32 actual_count = 5;  // 实际进入背包数量
  uint32 remaining_count = 6; // 因背包满剩余数量
}

/**
 * 掉落物消失通知（超时消失）
 */
message DropRemoveNotify {
  repeated uint64 drop_ids = 1;
}
