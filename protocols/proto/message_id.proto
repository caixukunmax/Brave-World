syntax = "proto3";

package protocol;

/**
 * 消息ID映射表
 * 用于消息路由和识别
 */
enum MessageId {
  UNKNOWN = 0;

  // 系统消息 (1-99)
  PING = 1;
  PONG = 2;

  // Gateway消息 (100-199)
  GATEWAY_HEARTBEAT_REQ = 100;
  GATEWAY_HEARTBEAT_RSP = 101;
  GATEWAY_CONNECT_REQ = 102;
  GATEWAY_CONNECT_RSP = 103;
  GATEWAY_DISCONNECT_NOTIFY = 104;
  GATEWAY_KICK_NOTIFY = 105;

  // Login消息 (200-299)
  LOGIN_ACCOUNT_LOGIN_REQ = 210;
  LOGIN_ACCOUNT_LOGIN_RSP = 211;
  LOGIN_SELECT_SERVER_REQ = 212;
  LOGIN_SELECT_SERVER_RSP = 213;

  // Server消息 (250-299)
  SERVER_GET_LIST_REQ = 250;
  SERVER_GET_LIST_RSP = 251;
  SERVER_STATUS_UPDATE = 252;

  // Game消息 (300-399)
  GAME_ENTER_GAME_REQ = 320;
  GAME_ENTER_GAME_RSP = 321;
  GAME_CREATE_ROLE_REQ = 322;
  GAME_CREATE_ROLE_RSP = 323;
  GAME_MOVE_REQ = 324;
  GAME_MOVE_RSP = 325;
  GAME_MOVE_CONFIRM_REQ = 326;
  GAME_MOVE_COMPLETE_REQ = 327;
  GAME_MOVE_CANCEL_NOTIFY = 328;
  GAME_USE_ITEM_REQ = 330;
  GAME_USE_ITEM_RSP = 331;
  GAME_DROP_ITEM_REQ = 332;
  GAME_DROP_ITEM_RSP = 333;
  GAME_GM_REQ = 340;
  GAME_GM_RSP = 341;

  // 宝箱 (350-359)
  GAME_OPEN_CHEST_REQ = 350;
  GAME_OPEN_CHEST_RSP = 351;
  GAME_CHEST_UPDATE_NOTIFY = 352;

  // 地图同步 (360-369)
  GAME_MAP_INFO_SYNC_NOTIFY = 360;
  GAME_CHANGE_MAP_REQ = 362;
  GAME_CHANGE_MAP_RSP = 363;

  // 怪物AI (370-379)
  GAME_MONSTER_MOVE_NOTIFY = 370;
  GAME_MONSTER_MOVE_START_NOTIFY = 371;
  GAME_MONSTER_MOVE_CANCEL_NOTIFY = 372;

  // 角色属性同步 (373-379)
  GAME_ROLE_ATTR_NOTIFY = 373;

  // 战斗日志 (380-389)
  GAME_COMBAT_LOG_NOTIFY = 380;
  GAME_COMBAT_STATE_NOTIFY = 381;

  // UI 面板位置 (390-399)
  GAME_UPDATE_UI_PANEL_POS_REQ = 390;
  GAME_UPDATE_UI_PANEL_POS_RSP = 391;
}
